services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trainhub
      POSTGRES_PASSWORD: trainhub
      POSTGRES_DB: trainhub
    ports:
      - "5432:5432"
    volumes:
      - trainhub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - trainhub_minio:/data

volumes:
  trainhub_pg:
  trainhub_minio:
